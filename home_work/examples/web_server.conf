% Domain: infrastructure. Configuration of a web service.
(*
  Constants are declared with "set" and substituted with ![name]
  while the text is translated, so every value is written only once.
*)
set service_name = 'shop-api'
set base_timeout = 30.0
set admin_contact = 'ops@example.com'
set security_headers = #(
  'X-Frame-Options: DENY'
  'X-Content-Type-Options: nosniff'
)

{
  name = ![service_name]
  version = '2.4'
  listen = {
    host = '0.0.0.0'
    port = 8080.0
    tls = {
      enabled = 'yes'
      certificate = '/etc/ssl/shop.pem'
    }
  }
  timeouts = {
    connect = .5          % seconds
    read = ![base_timeout]
    write = ![base_timeout]
  }
  upstreams = #(
    { host = '10.0.0.11' port = 9000.0 weight = 1.5 }
    { host = '10.0.0.12' port = 9000.0 weight = .5 }
  )
  headers = ![security_headers]
  contact = ![admin_contact]
}
