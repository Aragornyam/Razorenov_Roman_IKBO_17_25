% Domain: home automation. Devices and scenes of a flat.
set day_temperature = 21.5
set night_temperature = 18.5
set wake_up = '07:30'
set lamp = { brightness = .8 color = 'warm' }

{
  home = 'Flat 12'
  rooms = {
    living_room = {
      lamps = #( ![lamp] { brightness = .3 color = 'cold' } )
      thermostat = ![day_temperature]
    }
    bedroom = {
      lamps = #( { brightness = .1 color = 'warm' } )
      thermostat = ![night_temperature]
      blinds = #()
    }
  }
  scenes = {
    morning = {
      alarms = #( ![wake_up] '07:45' )
      target_temperature = ![day_temperature]
    }
    night = {
      alarms = #()
      target_temperature = ![night_temperature]
      lock_doors = 'yes'
    }
    away = {}
  }
}
